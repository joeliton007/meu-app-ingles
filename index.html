<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Inglês - Prática Oral & Palácio da Memória</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        .counter {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .phrase-en {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 8px;
        }
        .phrase-phonetic {
            font-size: 1.1rem;
            color: #ffca28;
            font-style: italic;
            margin-bottom: 8px;
        }
        .phrase-pt {
            font-size: 1rem;
            color: #bbb;
            margin-bottom: 15px;
        }

        /* BLOCO DO PALÁCIO DA MEMÓRIA */
        .memory-palace-box {
            background: linear-gradient(135deg, #1f2a38 0%, #161d26 100%);
            border: 1px solid #3a4b61;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .memory-palace-header {
            font-size: 0.8rem;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .memory-location {
            font-size: 0.95rem;
            color: #ffca28;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .memory-scene {
            font-size: 0.9rem;
            color: #e0e0e0;
            line-height: 1.4;
        }

        .btn {
            background-color: #2b2b2b;
            color: white;
            border: 2px solid #444;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            margin: 8px 0;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #3d3d3d;
            border-color: #666;
        }
        .btn-speed {
            background-color: #212121;
            border-color: #555;
            color: #ffca28;
            font-size: 0.95rem;
        }
        .btn-mic {
            background-color: #2e7d32;
            border-color: #4caf50;
            font-weight: bold;
        }
        .btn-mic.listening {
            background-color: #c62828;
            border-color: #ef5350;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .nav-btns .btn {
            width: 48%;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        .success {
            background-color: #1b5e20;
            color: #81c784;
        }
        .error {
            background-color: #b71c1c;
            color: #e57373;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #252525;
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            border: 1px solid #444;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #4da6ff;
        }
        .option-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
        }
        .option-btn.active {
            background-color: #2e7d32;
            border-color: #81c784;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="counter" id="counter">Frase 1 de 100</div>
    <div class="phrase-en" id="phrase-en">...</div>
    <div class="phrase-phonetic" id="phrase-phonetic">...</div>
    <div class="phrase-pt" id="phrase-pt">...</div>

    <!-- Bloco de Mnemônica e Palácio da Memória -->
    <div class="memory-palace-box">
        <div class="memory-palace-header">🧠 Palácio da Memória | Gatilho Visual</div>
        <div class="memory-location" id="memory-location">...</div>
        <div class="memory-scene" id="memory-scene">...</div>
    </div>

    <button class="btn btn-speed" onclick="openModal()">⚙️ Velocidade: <span id="current-speed-label">Super Lenta</span></button>
    <button class="btn" onclick="speakPhraseTwice()">🔊 Ouvir Pronúncia (2x)</button>
    <button class="btn btn-mic" id="btn-mic" onclick="toggleListening()">🎙️ Falar Agora</button>

    <div class="nav-btns">
        <button class="btn" onclick="prevPhrase()">⬅️ Anterior</button>
        <button class="btn" onclick="nextPhrase()">Próxima ➡️</button>
    </div>

    <div class="result" id="result"></div>
</div>

<div class="modal" id="speedModal">
    <div class="modal-content">
        <h3>Escolha a Velocidade</h3>
        <button class="option-btn active" id="opt-word-by-word" onclick="selectSpeed('word-by-word', 'Super Lenta')">1. Super Lenta (Pausada)</button>
        <button class="option-btn" id="opt-0.5" onclick="selectSpeed('0.5', 'Lenta')">2. Lenta (Corrida)</button>
        <button class="option-btn" id="opt-0.75" onclick="selectSpeed('0.75', 'Normal')">3. Normal</button>
        <button class="option-btn" id="opt-1.0" onclick="selectSpeed('1.0', 'Nativa')">4. Nativa</button>
    </div>
</div>

<script>
const phrases = [
    // 1 a 10: Cumprimentos e Conversa Inicial
    { en: "How is it going?", phonetic: "Ráu íz it góuin?", pt: "Como vão as coisas?", location: "📍 Estação 1: Porta de Entrada", scene: "Mentalize a <b>Áurea</b> na porta de entrada pegando um <b>gole</b> de café e <b>indo</b> embora correndo." },
    { en: "What have you been up to?", phonetic: "Uát révv iu bín áp tu?", pt: "O que você tem feito de bom?", location: "📍 Estação 2: Sala de Estar", scene: "Gatilho: Veja um <b>Uat</b>er (Garçom) com o <b>Apt</b>o em cima do sofá te perguntando o que você fez." },
    { en: "Long time no see!", phonetic: "Lóng táim nóu sí!", pt: "Quanto tempo a gente não se vê!", location: "📍 Estação 3: Corredor", scene: "Gatilho: Um dragão <b>Longo</b> e um <b>Time</b> sem ver ninguém no escuro do corredor." },
    { en: "Pretty good, thanks!", phonetic: "Príti gúd, tÉnks!", pt: "Muito bem, obrigado!", location: "📍 Estação 4: Cozinha", scene: "Gatilho: Uma pessoa <b>Príti</b> (Preta/Bonita) segurando uma comida muito <b>Gúd</b> na mesa da cozinha." },
    { en: "Can't complain.", phonetic: "Kênt kôm-pléin.", pt: "Não posso me queixar.", location: "📍 Estação 5: Varanda", scene: "Gatilho: Alguém segurando uma <b>Canta</b> de refrigerante e um <b>Complo</b> na varanda sem reclamar." },
    { en: "Same as usual.", phonetic: "Séim êz iú-jiu-al.", pt: "Tudo na mesma.", location: "📍 Estação 6: Banheiro", scene: "Gatilho: O <b>Sem</b>afóro funcionando do mesmo jeito de sempre em cima da pia." },
    { en: "Not much, you?", phonetic: "Nót mátch, iú?", pt: "Nada demais, e você?", location: "📍 Estação 7: Quarto Principal", scene: "Gatilho: Um <b>Nota</b> de dinheiro e um <b>Match</b> de fósforo em cima da cama." },
    { en: "How do you know?", phonetic: "Ráu dú iu nóu?", pt: "Como você sabe?", location: "📍 Estação 8: Escritório", scene: "Gatilho: Uma pessoa perguntando <b>Ráu</b> (Rao) enquanto dá um nó (<b>Nóu</b>) numa corda." },
    { en: "That makes sense.", phonetic: "Đêt méiks sêns.", pt: "Faz sentido.", location: "📍 Estação 9: Garagem", scene: "Gatilho: Alguém fazendo uma <b>Meica</b> (Maquiagem) com <b>Censo</b> no carro." },
    { en: "I see what you mean.", phonetic: "Ái sí uát iu mín.", pt: "Entendi o que você quer dizer.", location: "📍 Estação 10: Portão Principal", scene: "Gatilho: Você vendo (<b>Sí</b>) uma mina (<b>Mín</b>) passando pelo portão." },

    // 11 a 20: Opinião e Expressões
    { en: "To be honest...", phonetic: "Tu bí ónêst...", pt: "Para ser sincero...", location: "📍 Estação 11: Jardim", scene: "Gatilho: Uma abelha (<b>Bí</b>) sendo honesta colhendo flor no jardim." },
    { en: "In my opinion...", phonetic: "Ín mái ô-pí-niôn...", pt: "Na minha opinião...", location: "📍 Estação 12: Sacada", scene: "Gatilho: Uma <b>Opinião</b> escrita em letras gigantes pendurada na sacada." },
    { en: "If you ask me...", phonetic: "Íf iu êsk mí...", pt: "Se você quer saber...", location: "📍 Estação 13: Lavanderia", scene: "Gatilho: Alguém te fazendo uma pergunta enquanto usa o <b>Ésk</b> (esfregão)." },
    { en: "I'm not really sure.", phonetic: "Áim nót rí-li shúr.", pt: "Não tenho muita certeza.", location: "📍 Estação 14: Dispensa", scene: "Gatilho: Um pote de <b>Ríli</b> (refrigerante) que você não tem certeza se está bom." },
    { en: "It depends.", phonetic: "Íts dí-pêndz.", pt: "Depende.", location: "📍 Estação 15: Escada", scene: "Gatilho: Um pendulo (<b>Dependz</b>) balançando no meio do degrau da escada." },
    { en: "I have no idea.", phonetic: "Ái rév nóu ái-día.", pt: "Não faço a menor ideia.", location: "📍 Estação 16: Hall de Entrada", scene: "Gatilho: Lâmpada de <b>Ideia</b> acendendo sem ninguém saber o motivo." },
    { en: "That sounds great!", phonetic: "Đêt sáundz gréit!", pt: "Parece ótimo!", location: "📍 Estação 17: Sala de Jantar", scene: "Gatilho: Um som (<b>Sáundz</b>) de música incrível saindo do prato de jantar." },
    { en: "Never mind.", phonetic: "Né-ver máind.", pt: "Deixa para lá / Esquece.", location: "📍 Estação 18: Sótão", scene: "Gatilho: Apagando algo da mente (<b>Máind</b>) e jogando no sótão." },
    { en: "No worries!", phonetic: "Nóu uó-rîs!", pt: "Sem problemas!", location: "📍 Estação 19: Adega", scene: "Gatilho: Garrafas sem nenhuma preocupação (<b>Uó-rîs</b>)." },
    { en: "It's up to you.", phonetic: "Íts áp tu iú.", pt: "Você quem sabe.", location: "📍 Estação 20: Piscina", scene: "Gatilho: Alguém apontando para cima (<b>Áp</b>) na beira da piscina." },

    // 31 a 40: Rotina e Ações
    { en: "I gotta go now.", phonetic: "Ái gó-ta góu náu.", pt: "Tenho que ir agora.", location: "📍 Estação 38: Saída da Sala", scene: "Gatilho: Um <b>Gato</b> com <b>Gatilho</b> correndo para a saída da sala." },

    // Mantendo todas as outras frases originais ativas no carregamento
    { en: "Could you help me out?", phonetic: "Kúd iu rélp mí áut?", pt: "Você poderia me dar uma ajuda?", location: "📍 Estação 21", scene: "Gatilho: Alguém pedindo <b>Hélp</b> (ajuda) na porta." },
    { en: "What do you mean?", phonetic: "Uát dú iu mín?", pt: "O que você quer dizer?", location: "📍 Estação 22", scene: "Gatilho: Uma <b>Mina</b> perguntando o significado de algo." },
    { en: "Could you repeat that?", phonetic: "Kúd iu rí-pít đêt?", pt: "Poderia repetir isso?", location: "📍 Estação 23", scene: "Gatilho: Um gravador repetindo o áudio no balcão." },
    { en: "Can you speak slower?", phonetic: "Kên iu spík slóu-er?", pt: "Pode falar mais devagar?", location: "📍 Estação 24", scene: "Gatilho: Um caracol andando bem devagar (<b>Slóu</b>)." },
    { en: "How do I get there?", phonetic: "Ráu dú ái gét đêr?", pt: "Como eu chego lá?", location: "📍 Estação 25", scene: "Gatilho: Alguém olhando para um mapa." },
    { en: "Where are you headed?", phonetic: "Uêr ár iu ré-dêd?", pt: "Para onde você está indo?", location: "📍 Estação 26", scene: "Gatilho: Uma pessoa andando em direção à saída." },
    { en: "Hold on a second.", phonetic: "Róuld ón ê sé-kônd.", pt: "Espera um segundo.", location: "📍 Estação 27", scene: "Gatilho: Segurando um relógio com a mão." },
    { en: "Give me a hand.", phonetic: "Gív mí ê rênd.", pt: "Me dá uma mãozinha.", location: "📍 Estação 28", scene: "Gatilho: Uma mão gigante saindo da parede." },
    { en: "What's going on?", phonetic: "Uáts góuin ón?", pt: "O que está acontecendo?", location: "📍 Estação 29", scene: "Gatilho: Pessoas surpresas olhando ao redor." },
    { en: "Are you free today?", phonetic: "Ár iu frí tu-déi?", pt: "Você está livre hoje?", location: "📍 Estação 30", scene: "Gatilho: Um calendário com o dia de hoje marcado com livre." },

    { en: "I'm on my way.", phonetic: "Áim ón mái uéi.", pt: "Estou a caminho.", location: "📍 Estação 31", scene: "Gatilho: Alguém correndo no meio do caminho." },
    { en: "I'll be right back.", phonetic: "Áil bí ráit bêk.", pt: "Já volto.", location: "📍 Estação 32", scene: "Gatilho: Uma placa de volta em breve na porta." },
    { en: "Take your time.", phonetic: "Téik iór táim.", pt: "Sem pressa.", location: "📍 Estação 33", scene: "Gatilho: Um relógio derretendo sem pressa." },
    { en: "I need some sleep.", phonetic: "Ái níd sóm slíp.", pt: "Preciso dormir um pouco.", location: "📍 Estação 34", scene: "Gatilho: Travesseiro macio piscando para você." },
    { en: "Let's call it a day.", phonetic: "Lêts kól ít ê déi.", pt: "Vamos encerrar por hoje.", location: "📍 Estação 35", scene: "Gatilho: Fechando a porta e desligando a luz." },
    { en: "I'm running late.", phonetic: "Áim râ-nin léit.", pt: "Estou atrasado.", location: "📍 Estação 36", scene: "Gatilho: Correndo contra o tempo com o relógio apitando." },
    { en: "Check this out!", phonetic: "Tchêk đís áut!", pt: "Olha só isso!", location: "📍 Estação 37", scene: "Gatilho: Apontando com uma lanterna para algo incrível." },
    { en: "Catch you later!", phonetic: "Kêtch iu léi-ter!", pt: "Te vejo mais tarde!", location: "📍 Estação 39", scene: "Gatilho: Acenando um tchau de longe." },
    { en: "Have a good one!", phonetic: "Rév ê gúd uân!", pt: "Tenha um ótimo dia!", location: "📍 Estação 40", scene: "Gatilho: Um sorriso brilhante na saída." },

    { en: "Are you kidding me?", phonetic: "Ár iu kí-din mí?", pt: "Tá de brincadeira comigo?", location: "📍 Estação 41", scene: "Gatilho: Um palhaço dando risada." },
    { en: "You've got to be kidding!", phonetic: "Iúvv gót tu bí kí-din!", pt: "Só pode ser piada!", location: "📍 Estação 42", scene: "Gatilho: Alguém rindo sem acreditar." },
    { en: "That's awesome!", phonetic: "Đêts ó-sôm!", pt: "Isso é incrível!", location: "📍 Estação 43", scene: "Gatilho: Fogos de artifício estourando." },
    { en: "I appreciate it.", phonetic: "Ái ê-prí-shi-eit ít.", pt: "Muito obrigado / Agradeço.", location: "📍 Estação 44", scene: "Gatilho: Um aperto de mão forte." },
    { en: "By the way...", phonetic: "Bái đê uéi...", pt: "A propósito...", location: "📍 Estação 45", scene: "Gatilho: Uma seta apontando para o lado do caminho." },
    { en: "Anyway...", phonetic: "É-ni-uéi...", pt: "Enfim...", location: "📍 Estação 46", scene: "Gatilho: Balançando as mãos para mudar de assunto." },
    { en: "No way!", phonetic: "Nóu uéi!", pt: "De jeito nenhum!", location: "📍 Estação 47", scene: "Gatilho: Um sinal gigante de proibido." },
    { en: "I agree with you.", phonetic: "Ái ê-grí uíđ iu.", pt: "Concordo com você.", location: "📍 Estação 48", scene: "Gatilho: Duas pessoas acenando positivamente com a cabeça." },
    { en: "That's pretty cool.", phonetic: "Đêts blí-ti kúl.", pt: "Bem legal isso.", location: "📍 Estação 49", scene: "Gatilho: Óculos de sol estilosos caindo no rosto." },
    { en: "Keep up the good work!", phonetic: "Kíp áp đê gúd uôrk!", pt: "Continue com o ótimo trabalho!", location: "📍 Estação 50", scene: "Gatilho: Um troféu brilhando na mesa." },

    { en: "Let me think about it.", phonetic: "Lêt mí tÉnk ê-báut ít.", pt: "Deixa eu pensar nisso.", location: "📍 Estação 51", scene: "Gatilho: Uma nuvem de pensamento acima da cabeça." },
    { en: "I'll let you know.", phonetic: "Áil lêt iu nóu.", pt: "Eu te aviso.", location: "📍 Estação 52", scene: "Gatilho: Enviando uma carta ou mensagem." },
    { en: "Make up your mind.", phonetic: "Méik áp iór máind.", pt: "Decida-se.", location: "📍 Estação 53", scene: "Gatilho: Uma balança de dois lados equilibrando." },
    { en: "It's not worth it.", phonetic: "Íts nót uôrt ít.", pt: "Não vale a pena.", location: "📍 Estação 54", scene: "Gatilho: Jogando moedas fora sem valor." },
    { en: "Forget about it.", phonetic: "Fôr-gét ê-báut ít.", pt: "Esqueça isso.", location: "📍 Estação 55", scene: "Gatilho: Apagador apagando um quadro negro." },

    { en: "Let's give it a try.", phonetic: "Lêts gív ít ê trái.", pt: "Vamos tentar.", location: "📍 Estação 59", scene: "Gatilho: Apertando um botão verde de START." },

    { en: "I'm exhausted.", phonetic: "Áim êg-zós-têd.", pt: "Estou exausto.", location: "📍 Estação 61", scene: "Gatilho: Bateria no 1% piscando." },
    { en: "I'm starving!", phonetic: "Áim stár-vin!", pt: "Estou morrendo de fome!", location: "📍 Estação 62", scene: "Gatilho: Prato vazio com garfo e faca." },

    { en: "Take it easy.", phonetic: "Téik ít í-zi.", pt: "Vá com calma / Relaxe.", location: "📍 Estação 66", scene: "Gatilho: Alguém meditando tranquilamente." },
    { en: "Calm down.", phonetic: "Kám dáun.", pt: "Calma / Acalme-se.", location: "📍 Estação 67", scene: "Gatilho: Mão fazendo gesto para baixar a poeira." },

    { en: "I lost my train of thought.", phonetic: "Ái lóst mái tréin óvv tót.", pt: "Perdi o fio da meada.", location: "📍 Estação 69", scene: "Gatilho: Um trem saindo dos trilhos de fumaça." },

    { en: "I have a lot on my plate.", phonetic: "Ái rév ê lót ón mái pléit.", pt: "Estou cheio de coisas para fazer.", location: "📍 Estação 71", scene: "Gatilho: Prato cheio transbordando papéis." },

let currentIndex = 0;
let recognition = null;
let currentSpeed = 'word-by-word';
let wordTimeouts = [];

function openModal() {
    document.getElementById('speedModal').style.display = 'flex';
}

function selectSpeed(value, label) {
    currentSpeed = value;
    document.getElementById('current-speed-label').innerText = label;
    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('opt-' + value).classList.add('active');
    document.getElementById('speedModal').style.display = 'none';
}

function loadPhrase() {
    clearWordTimeouts();
    const item = phrases[currentIndex];
    document.getElementById('counter').innerText = `Frase ${currentIndex + 1} de ${phrases.length}`;
    document.getElementById('phrase-en').innerText = item.en;
    document.getElementById('phrase-phonetic').innerText = item.phonetic;
    document.getElementById('phrase-pt').innerText = item.pt;
    
    // Atualização dos campos do Palácio da Memória
    document.getElementById('memory-location').innerText = item.location || `📍 Estação ${currentIndex + 1}`;
    document.getElementById('memory-scene').innerHTML = item.scene || "Visualize a cena correspondente no seu palácio mental.";

    document.getElementById('result').style.display = 'none';
}

function clearWordTimeouts() {
    wordTimeouts.forEach(t => clearTimeout(t));
    wordTimeouts = [];
}

function getBestVoice() {
    const voices = window.speechSynthesis.getVoices();
    let best = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Enhanced')));
    if (!best) {
        best = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
    }
    return best;
}

function playOnce(onEndedCallback) {
    const text = phrases[currentIndex].en;
    const usVoice = getBestVoice();

    if (currentSpeed === 'word-by-word') {
        const words = text.split(' ');
        let delay = 0;

        words.forEach((word, index) => {
            const timeout = setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.65;
                if (usVoice) utterance.voice = usVoice;
                
                if (index === words.length - 1 && onEndedCallback) {
                    utterance.onend = onEndedCallback;
                }
                
                window.speechSynthesis.speak(utterance);
            }, delay);

            wordTimeouts.push(timeout);
            delay += 900;
        });
    } else {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = parseFloat(currentSpeed);
        if (usVoice) utterance.voice = usVoice;
        if (onEndedCallback) utterance.onend = onEndedCallback;
        window.speechSynthesis.speak(utterance);
    }
}

function speakPhraseTwice() {
    window.speechSynthesis.cancel();
    clearWordTimeouts();

    // Primeira vez
    playOnce(() => {
        // Pausa de 1.2 segundos entre as duas falas
        const t = setTimeout(() => {
            // Segunda vez
            playOnce();
        }, 1200);
        wordTimeouts.push(t);
    });
}

function nextPhrase() {
    if (currentIndex < phrases.length - 1) {
        currentIndex++;
        loadPhrase();
    }
}

function prevPhrase() {
    if (currentIndex > 0) {
        currentIndex--;
        loadPhrase();
    }
}

function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Seu navegador não suporta reconhecimento de voz. Recomendamos o Google Chrome.");
        return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onstart = () => {
        const btn = document.getElementById('btn-mic');
        btn.classList.add('listening');
        btn.innerText = "🎙️ Ouvindo... Fale agora!";
    };

    recognition.onend = () => {
        const btn = document.getElementById('btn-mic');
        btn.classList.remove('listening');
        btn.innerText = "🎙️ Falar Agora";
    };

    recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript.toLowerCase().replace(/[.,?!]/g, '');
        const targetText = phrases[currentIndex].en.toLowerCase().replace(/[.,?!]/g, '');
        
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (spokenText === targetText || targetText.includes(spokenText)) {
            resultDiv.className = 'result success';
            resultDiv.innerText = `✔️ Perfeito! Você disse: "${event.results[0][0].transcript}"`;
        } else {
            resultDiv.className = 'result error';
            resultDiv.innerText = `❌ Você falou: "${event.results[0][0].transcript}". Tente novamente!`;
        }
    };
}

function toggleListening() {
    if (!recognition) initSpeech();
    if (recognition) recognition.start();
}

if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

loadPhrase();
</script>
