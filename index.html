<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Inglês - Prática Oral</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        .counter {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .phrase-en {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 8px;
        }
        .phrase-phonetic {
            font-size: 1.1rem;
            color: #ffca28;
            font-style: italic;
            margin-bottom: 12px;
        }
        .phrase-pt {
            font-size: 1rem;
            color: #bbb;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #2b2b2b;
            color: white;
            border: 2px solid #444;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            margin: 8px 0;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #3d3d3d;
            border-color: #666;
        }
        .btn-speed {
            background-color: #212121;
            border-color: #555;
            color: #ffca28;
            font-size: 0.95rem;
        }
        .btn-mic {
            background-color: #2e7d32;
            border-color: #4caf50;
            font-weight: bold;
        }
        .btn-mic.listening {
            background-color: #c62828;
            border-color: #ef5350;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .nav-btns .btn {
            width: 48%;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        .success {
            background-color: #1b5e20;
            color: #81c784;
        }
        .error {
            background-color: #b71c1c;
            color: #e57373;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #252525;
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            border: 1px solid #444;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #4da6ff;
        }
        .option-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
        }
        .option-btn.active {
            background-color: #2e7d32;
            border-color: #81c784;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="counter" id="counter">Frase 1 de 100</div>
    <div class="phrase-en" id="phrase-en">...</div>
    <div class="phrase-phonetic" id="phrase-phonetic">...</div>
    <div class="phrase-pt" id="phrase-pt">...</div>

    <button class="btn btn-speed" onclick="openModal()">⚙️ Velocidade: <span id="current-speed-label">Super Lenta</span></button>
    <button class="btn" onclick="speakPhrase()">🔊 Ouvir Pronúncia</button>
    <button class="btn btn-mic" id="btn-mic" onclick="toggleListening()">🎙️ Falar Agora</button>

    <div class="nav-btns">
        <button class="btn" onclick="prevPhrase()">⬅️ Anterior</button>
        <button class="btn" onclick="nextPhrase()">Próxima ➡️</button>
    </div>

    <div class="result" id="result"></div>
</div>

<div class="modal" id="speedModal">
    <div class="modal-content">
        <h3>Escolha a Velocidade</h3>
        <button class="option-btn active" id="opt-word-by-word" onclick="selectSpeed('word-by-word', 'Super Lenta')">1. Super Lenta (Pausada)</button>
        <button class="option-btn" id="opt-0.5" onclick="selectSpeed('0.5', 'Lenta')">2. Lenta (Corrida)</button>
        <button class="option-btn" id="opt-0.75" onclick="selectSpeed('0.75', 'Normal')">3. Normal</button>
        <button class="option-btn" id="opt-1.0" onclick="selectSpeed('1.0', 'Nativa')">4. Nativa</button>
    </div>
</div>

<script>

    { en: "Can't complain.", phonetic: "Kênt kôm-pléin.", pt: "Não posso me queixar." },

    // 11 a 20: Opinião e Expressões
    { en: "To be honest...", phonetic: "Tu bí ónêst...", pt: "Para ser sincero..." },
    { en: "In my opinion...", phonetic: "Ín mái ô-pí-niôn...", pt: "Na minha opinião..." },
    { en: "If you ask me...", phonetic: "Íf iu êsk mí...", pt: "Se você quer saber..." },

    { en: "It depends.", phonetic: "Ít dí-pêndz.", pt: "Depende." },
    { en: "I have no idea.", phonetic: "Ái rév nóu ái-día.", pt: "Não faço a menor ideia." },
    { en: "That sounds great!", phonetic: "Đêt sáundz gréit!", pt: "Parece ótimo!" },
    { en: "Never mind.", phonetic: "Né-ver máind.", pt: "Deixa para lá / Esquece." },

    { en: "I'm on my way.", phonetic: "Áim ón mái uéi.", pt: "Estou a caminho." },
    { en: "I'll be right back.", phonetic: "Áil bí ráit bêk.", pt: "Já volto." },

    { en: "Are you kidding me?", phonetic: "Ár iu kí-din mí?", pt: "Tá de brincadeira comigo?" },
    { en: "You've got to be kidding!", phonetic: "Iúvv gót tu bí kí-din!", pt: "Só pode ser piada!" },
    { en: "That's awesome!", phonetic: "Đêts ó-sôm!", pt: "Isso é incrível!" },
    { en: "I appreciate it.", phonetic: "Ái ê-prí-shi-eit ít.", pt: "Muito obrigado / Agradeço." },
    { en: "By the way...", phonetic: "Bái đê uéi...", pt: "A propósito..." },
    { en: "Anyway...", phonetic: "É-ni-uéi...", pt: "Enfim..." },
    { en: "No way!", phonetic: "Nóu uéi!", pt: "De jeito nenhum!" },
    { en: "I agree with you.", phonetic: "Ái ê-grí uíđ iu.", pt: "Concordo com você." },
    { en: "That's pretty cool.", phonetic: "Đêts blí-ti kúl.", pt: "Bem legal isso." },
    { en: "Keep up the good work!", phonetic: "Kíp áp đê gúd uôrk!", pt: "Continue com o ótimo trabalho!" },

    // 51 a 60: Tomando Decisões
    { en: "Let me think about it.", phonetic: "Lêt mí tÉnk ê-báut ít.", pt: "Deixa eu pensar nisso." },
    { en: "I'll let you know.", phonetic: "Áil lêt iu nóu.", pt: "Eu te aviso." },
    { en: "Make up your mind.", phonetic: "Méik áp iór máind.", pt: "Decida-se." },
    { en: "It's not worth it.", phonetic: "Íts nót uôrt ít.", pt: "Não vale a pena." },
    { en: "Forget about it.", phonetic: "Fôr-gét ê-báut ít.", pt: "Esqueça isso." },
    { en: "That's a good point.", phonetic: "Đêts ê gúd póint.", pt: "Bem lembrado / Bom ponto." },
    { en: "I couldn't agree more.", phonetic: "Ái kúdnt ê-grí mór.", pt: "Concordo totalmente." },
    { en: "Are you sure about that?", phonetic: "Ár iu shúr ê-báut đêt?", pt: "Tem certeza disso?" },
    { en: "Let's give it a try.", phonetic: "Lêts gív ít ê trái.", pt: "Vamos tentar." },
    { en: "Better late than never.", phonetic: "Bé-ter léit đên né-ver.", pt: "Antes tarde do que nunca." },

    // 61 a 70: Sentimentos e Estados
    { en: "I'm exhausted.", phonetic: "Áim êg-zós-têd.", pt: "Estou exausto." },
    { en: "I'm starving!", phonetic: "Áim stár-vin!", pt: "Estou morrendo de fome!" },
    { en: "I feel sick.", phonetic: "Ái fíl sík.", pt: "Estou me sentindo mal." },
    { en: "I'm looking forward to it.", phonetic: "Áim lú-kin fór-uârd tu ít.", pt: "Estou ansioso por isso." },
    { en: "Don't worry about it.", phonetic: "Dóunt uó-ri ê-báut ít.", pt: "Não se preocupe com isso." },
    { en: "Take it easy.", phonetic: "Téik ít í-zi.", pt: "Vá com calma / Relaxe." },
    { en: "Calm down.", phonetic: "Kám dáun.", pt: "Calma / Acalme-se." },
    { en: "I'm so proud of you.", phonetic: "Áim sóu práud óvv iu.", pt: "Tenho tanto orgulho de você." },
    { en: "I lost my train of thought.", phonetic: "Ái lóst mái tréin óvv tót.", pt: "Perdi o fio da meada." },
    { en: "I'm in a hurry.", phonetic: "Áim ín ê rê-ri.", pt: "Estou com pressa." },

    // 71 a 80: Trabalho e Compromissos
    { en: "I have a lot on my plate.", phonetic: "Ái rév ê lót ón mái pléit.", pt: "Estou cheio de coisas para fazer." },
    { en: "Can we reschedule?", phonetic: "Kên uí rí-ské-jiul?", pt: "Podemos remarcar?" },
    { en: "I'll handle it.", phonetic: "Áil rên-dôl ít.", pt: "Eu cuido disso." },
    { en: "Keep me posted.", phonetic: "Kíp mí póus-têd.", pt: "Mantenha-me informado." },
    { en: "So far, so good.", phonetic: "Sóu fár, sóu gúd.", pt: "Até agora, tudo bem." },
    { en: "Back to square one.", phonetic: "Bêk tu skuêr uân.", pt: "De volta ao zero." },
    { en: "It's a piece of cake.", phonetic: "Íts ê pís óvv kéik.", pt: "É mamão com açúcar / Muito fácil." },

    { en: "Text me when you get there.", phonetic: "Têkst mí uên iu gét đêr.", pt: "Me manda mensagem quando chegar." },

    { en: "Drop me a line.", phonetic: "Dróp mí ê láin.", pt: "Me manda uma mensagem." },
    { en: "I'll call you right back.", phonetic: "Áil kól iu ráit bêk.", pt: "Já te ligo de volta." },

    { en: "Same here!", phonetic: "Séim rír!", pt: "Igualmente!" },
    { en: "Have a safe trip!", phonetic: "Rév ê séif tríp!", pt: "Boa viagem!" },
    { en: "Enjoy your meal!", phonetic: "Ín-jói iór míol!", pt: "Bom apetite!" },
    { en: "Make yourself at home.", phonetic: "Méik ior-sélfêt róum.", pt: "Sinta-se em casa." },
    { en: "Cross your fingers!", phonetic: "Krós iór fín-gêrz!", pt: "Torça por mim / Dedos cruzados!" },
    { en: "Time flies!", phonetic: "Táim fláis!", pt: "O tempo voa!" },
    { en: "Better safe than sorry.", phonetic: "Bé-ter séif đên só-ri.", pt: "É melhor prevenir do que remediar." },
    { en: "Practice makes perfect.", phonetic: "Prêk-tís méiks pûr-fêkt.", pt: "A prática leva à perfeição." },

let currentIndex = 0;
let recognition = null;
let currentSpeed = 'word-by-word';
let wordTimeouts = [];

function openModal() {
    document.getElementById('speedModal').style.display = 'flex';
}

function selectSpeed(value, label) {
    currentSpeed = value;
    document.getElementById('current-speed-label').innerText = label;
    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('opt-' + value).classList.add('active');
    document.getElementById('speedModal').style.display = 'none';
}

function loadPhrase() {
    clearWordTimeouts();
    const item = phrases[currentIndex];
    document.getElementById('counter').innerText = `Frase ${currentIndex + 1} de ${phrases.length}`;
    document.getElementById('phrase-en').innerText = item.en;
    document.getElementById('phrase-phonetic').innerText = item.phonetic;
    document.getElementById('phrase-pt').innerText = item.pt;
    document.getElementById('result').style.display = 'none';
}

function clearWordTimeouts() {
    wordTimeouts.forEach(t => clearTimeout(t));
    wordTimeouts = [];
}

function getBestVoice() {
    const voices = window.speechSynthesis.getVoices();
    let best = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Enhanced')));
    if (!best) {
        best = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
    }
    return best;
}

function speakPhrase() {
    window.speechSynthesis.cancel();
    clearWordTimeouts();

    const text = phrases[currentIndex].en;
    const usVoice = getBestVoice();

    if (currentSpeed === 'word-by-word') {
        const words = text.split(' ');
        let delay = 0;

        words.forEach((word) => {
            const timeout = setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.65;
                if (usVoice) utterance.voice = usVoice;
                window.speechSynthesis.speak(utterance);
            }, delay);

            wordTimeouts.push(timeout);
            delay += 900;
        });
    } else {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = parseFloat(currentSpeed);
        if (usVoice) utterance.voice = usVoice;
        window.speechSynthesis.speak(utterance);
    }
}

function nextPhrase() {
    if (currentIndex < phrases.length - 1) {
        currentIndex++;
        loadPhrase();
    }
}

function prevPhrase() {
    if (currentIndex > 0) {
        currentIndex--;
        loadPhrase();
    }
}

function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Seu navegador não suporta reconhecimento de voz. Recomendamos o Google Chrome.");
        return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onstart = () => {
        const btn = document.getElementById('btn-mic');
        btn.classList.add('listening');
        btn.innerText = "🎙️ Ouvindo... Fale agora!";
    };

    recognition.onend = () => {
        const btn = document.getElementById('btn-mic');
        btn.classList.remove('listening');
        btn.innerText = "🎙️ Falar Agora";
    };

    recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript.toLowerCase().replace(/[.,?!]/g, '');
        const targetText = phrases[currentIndex].en.toLowerCase().replace(/[.,?!]/g, '');
        
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (spokenText === targetText || targetText.includes(spokenText)) {
            resultDiv.className = 'result success';
            resultDiv.innerText = `✔️ Perfeito! Você disse: "${event.results[0][0].transcript}"`;
        } else {
            resultDiv.className = 'result error';
            resultDiv.innerText = `❌ Você falou: "${event.results[0][0].transcript}". Tente novamente!`;
        }
    };
}

function toggleListening() {
    if (!recognition) initSpeech();
    if (recognition) recognition.start();
}

if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

loadPhrase();
</script>

</body>
</html>
